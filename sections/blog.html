<!-- ===== BLOG SECTION ===== -->
<!-- 
  Blog posts are loaded dynamically from data/blog.json
  To add a new post, just add an entry to the JSON file!
-->
<section id="blog" class="section blog" data-section="blog">
  <div class="container">
    <header class="section__header" data-reveal="up">
      <h2 class="section__title">Blog</h2>
      <p class="section__subtitle">Thoughts, learnings, and reflections</p>
    </header>

    <!-- Blog Posts Grid (rendered dynamically) -->
    <div class="blog__grid" data-reveal="up" data-delay="100" id="blog-grid">
      <!-- Posts loaded from JSON -->
      <div class="loading">Loading posts...</div>
    </div>
  </div>
</section>
